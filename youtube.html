<!DOCTYPE html>
<html>

<head>
  <title>Youtube clone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <style>
    p {
      font-family: Roboto, Arial;
      margin-top: 0;
      margin-bottom: 0;
    }

    .thumbnail-row {
      margin-bottom: 10px;
    }

    .thumbnail {
      width: 100%;
    }

    .search-bar {
      font-size: 16px;
      margin-left: 15px;
      display: block;
    }

    .video-title {
      font-weight: bold;
      font-size: 18px;
      line-height: 24px;
      margin-bottom: 5px;
    }

    .video-stats {
      font-size: 14px;
      color: rgb(96, 96, 96);
      margin-bottom: 20px;
    }

    .video-author {
      font-size: 14px;
      color: rgb(96, 96, 96);
      margin-bottom: 5px;
    }

    .profile-picture {
      width: 50px;
      border-radius: 50px;
    }

    .video-info-grid {
      display: grid;
      grid-template-columns: 55px 1fr;
    }

    .video-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      column-gap: 20px;
      row-gap: 10px;
    }
  </style>
</head>

<body>
  <input class="search-bar" type="text" placeholder="Search">
  <div class="video-grid">
    <div>
      <div class="thumbnail-row">
        <img class="thumbnail" src="thumbnail-1.webp">
      </div>
      <div class="video-info-grid">
        <div>
          <img class="profile-picture" src="channel-pictures/channel-1.jpeg">
        </div>
        <div>
          <p class="video-title">
            Talking Tech and AI with Google CEO Sundar Pichai!
          </p>
          <p class="video-author">
            Marques Brownlee
          </p>
          <p class="video-stats">
            3.4M views &#183; 6 months ago
          </p>
        </div>
      </div>
    </div>

    <div>
      <div class="thumbnail-row">
        <img class="thumbnail" src="thumbnail-2.webp">
      </div>
      <div class="video-info-grid">
        <div>
          <img class="profile-picture" src="channel-pictures/channel-1.jpeg">
        </div>
        <div>
          <p class="video-title">
            Try Not To Laugh Challenge #9
          </p>
          <p class="video-author">
            Markiplier
          </p>
          <p class="video-stats">
            19M views &#183; 4 years ago
          </p>
        </div>
      </div>
    </div>

    <div>
      <div class="thumbnail-row">
        <img class="thumbnail" src="thumbnail-1.webp">
      </div>
      <div class="video-info-grid">
        <div>
          <img class="profile-picture" src="channel-pictures/channel-1.jpeg">
        </div>
        <div>
          <p class="video-title">
            Talking Tech and AI with Google CEO Sundar Pichai!
          </p>
          <p class="video-author">
            Marques Brownlee
          </p>
          <p class="video-stats">
            3.4M views &#183; 6 months ago
          </p>
        </div>
      </div>
    </div>

  </div>
</body>

</html>
