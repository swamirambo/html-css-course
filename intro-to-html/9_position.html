<!DOCTYPE html>
<html>
  <head>
    <title>Position</title>
  </head>
  <body style="
    height: 3000px;
    padding-top: 60px;
    padding-left: 80px;
    ">

    <!--position: fixed; is not not take any space -->
    <div style="
      background-color: black;
      color: white;
      position: fixed;
      top: 0px;
      left: 0px;
      right: 0px;
      height: 60px;
      z-index: 100;
      ">Header</div>

    <div style="
      background-color: green;
      color: white;
      position: fixed;
      top: 60px;
      left:0px;
      width: 80px;
      bottom: 0px;
      ">Sidebar</div>

    <div style="
      background-color: red;
      color: white;
      position: absolute;
      top: 70px;
      right: 20px;
      z-index: 0;
      ">absolute</div>
      
    <!--position: static; is default-->
    <div style="
      background-color: lightblue;
      height: 300px;
      width: 300px;
      position: static;
      ">div 1</div>
    <div style="
      background-color: lightpink;
      height: 300px;
      width: 300px;
      ">div 2</div>
  </body>
</html>
