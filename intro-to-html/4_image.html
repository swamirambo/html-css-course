<!DOCTYPE html>
<html>
  <head>
    <title>Image</title>
    <style>
      .thubbnail-0 {
        width: 300px;
        border-width: 2px;
        border-color: red;
        border-style: solid;
      }
      .thubbnail-1 {
        width: 300px;
        height: 300px;
        object-fit: contain;
        object-position: bottom;
        border-width: 2px;
        border-color: red;
        border-style: solid;
      }
      .thubbnail-2 {
        width: 300px;
        height: 300px;
        object-fit: cover;
        object-position: right;
        border-width: 2px;
        border-color: red;
        border-style: solid;
      }
    </style>
  </head>
  <body>
    <p>
      <img class="thubbnail-0" src="thumbnail-1.webp">
    </p>
    <p>
      <img class="thubbnail-1" src="thumbnail-1.webp">
    </p>
    <p>
      <img class="thubbnail-2" src="thumbnail-1.webp">
    </p>
  </body>
</html>
